---
name: Wheel Builds (dry run)
on:
  push:
jobs:
  sdist:
    if: github.repository == 'IvanIsCoding/rustworkx'
    name: Build sdist
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    needs: ["upload_shared_wheels"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -U "maturin>=1.9.0,<2.0" build
      - name: Build sdist
        run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          path: ./dist/*
          name: sdist-rustworkx
      - name: Show distribution SHA256
        run: sha256sum ./dist/*
  build_wheels:
    if: github.repository == 'IvanIsCoding/rustworkx'
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-14, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cibuildwheel
        run: |
          python -m pip install -U --group releaseinfra
      - name: Build wheels
        run: |
          python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          path: ./wheelhouse/*.whl
          name: shared-wheel-builds-${{ matrix.os }}
  upload_shared_wheels:
    if: github.repository == 'IvanIsCoding/rustworkx'
    name: Upload shared build wheels
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    needs: ["build_wheels", "build-win32-wheels"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shared-wheel-builds-*
          merge-multiple: true
          path: deploy
      - name: Show wheel SHA256
        run: sha256sum deploy/*.whl
  build_emscripten:
    if: github.repository == 'IvanIsCoding/rustworkx'
    name: Build wheels for Pyodide (Emscripten)
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
          components: rust-src
      - name: Install cibuildwheel
        run: |
          python -m pip install cibuildwheel==4.1.0
      - name: Build wheels
        run: |
          python -m cibuildwheel --platform pyodide --output-dir wheelhouse
        env:
          CIBW_BUILD: cp314-pyodide_wasm32
          CIBW_BUILD_VERBOSITY: 3
      - uses: actions/upload-artifact@v4
        with:
          path: ./wheelhouse/*.whl
          name: wheel-builds-emscripten
  upload_emscripten:
    if: github.repository == 'IvanIsCoding/rustworkx'
    name: Upload wheels for Pyodide (Emscripten)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    needs: ["build_emscripten", "upload_shared_wheels"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-builds-emscripten
          path: wheelhouse
      - name: Show wheel SHA256
        run: sha256sum wheelhouse/*.whl
  build-win32-wheels:
    if: github.repository == 'IvanIsCoding/rustworkx'
    name: Build wheels on win32
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.12'
          architecture: 'x86'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - name: Force win32 rust
        run: rustup default stable-i686-pc-windows-msvc
      - name: Install cibuildwheel
        run: |
          python -m pip install -U --group releaseinfra
      - name: Build wheels
        run: |
          python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_SKIP: pp* c*t-win* *amd64 *musl*
      - uses: actions/upload-artifact@v4
        with:
          path: ./wheelhouse/*.whl
          name: shared-wheel-builds-win32
